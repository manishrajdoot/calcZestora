<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e0e0e0">
    <title>CalcZestora</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="https://emojicdn.elk.sh/🧮?style=apple" type="image/png">
    <script src="script.js" defer></script>
</head>
<body>
    <button id="theme-toggle" aria-label="Switch to dark theme">🌙</button>
    <button id="sound-toggle" aria-label="Toggle sound effects">🔊</button>

    <div class="calculator-wrapper">
        <div class="calculator" role="application" aria-label="Calculator">
            <div id="history" class="calculator__history" aria-label="Calculation history"></div>
            <div id="display" class="calculator__output" role="textbox" aria-live="polite">0</div>

            <div class="calculator__keys" role="grid">
                <button class="button function" id="clear" value="clear" aria-label="Clear all">AC</button>
                <button class="button function" id="delete" value="delete" aria-label="Delete last digit">DEL</button>
                <button class="button function" id="memory-clear" value="mc" aria-label="Memory clear">MC</button>
                <button class="button function" id="memory-recall" value="mr" aria-label="Memory recall">MR</button>

                <button class="button number" id="seven" value="7" aria-label="Seven">7</button>
                <button class="button number" id="eight" value="8" aria-label="Eight">8</button>
                <button class="button number" id="nine" value="9" aria-label="Nine">9</button>
                <button class="button operator" id="divide" value="/" aria-label="Divide">÷</button>

                <button class="button number" id="four" value="4" aria-label="Four">4</button>
                <button class="button number" id="five" value="5" aria-label="Five">5</button>
                <button class="button number" id="six" value="6" aria-label="Six">6</button>
                <button class="button operator" id="multiply" value="*" aria-label="Multiply">×</button>

                <button class="button number" id="one" value="1" aria-label="One">1</button>
                <button class="button number" id="two" value="2" aria-label="Two">2</button>
                <button class="button number" id="three" value="3" aria-label="Three">3</button>
                <button class="button operator" id="subtract" value="-" aria-label="Subtract">-</button>

                <button class="button number button--large" id="zero" value="0" aria-label="Zero">0</button>
                <button class="button number" id="decimal" value="." aria-label="Decimal point">.</button>
                <button class="button operator" id="add" value="+" aria-label="Add">+</button>
                <button class="button function" id="memory-subtract" value="m-" aria-label="Memory subtract">M-</button>
                <button class="button equals" id="equals" value="=" aria-label="Calculate">=</button>

                <button class="button function" id="memory-add" value="m+" aria-label="Memory add">M+</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer__content">
            <span class="footer__icon">🧮</span>
            <span class="footer__name">CalcZestora</span>
            <p class="footer__credit">
                Developed by 
                <a href="https://www.instagram.com/manish.rajdoot/" target="_blank" rel="noopener noreferrer" class="footer__link">Manish Rajdoot</a> 
                © 2025
            </p>
        </div>
    </footer>
</body>
</html>
